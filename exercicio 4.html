<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Calculadora de IMC</title>
</head>
<body>

    <h1>Calculadora de IMC</h1>

    <label>Peso (kg):</label><br>
    <input type="number" id="peso" placeholder="Ex: 70"><br><br>

    <label>Altura (metros):</label><br>
    <input type="number" id="altura" placeholder="Ex: 1.75" step="0.01"><br><br>

    <button onclick="calcularIMC()">Calcular</button>

    <p id="resultado" style="font-weight: bold; font-size: 18px;"></p>

    <script>
        function calcularIMC() {
        
            let peso = parseFloat(document.getElementById("peso").value);
            let altura = parseFloat(document.getElementById("altura").value);

            if (isNaN(peso) || isNaN(altura) || altura <= 0) {
                document.getElementById("resultado").textContent = "Por favor, digite valores válidos!";
                document.getElementById("resultado").style.color = "black";
                return;
            }

      
            let imc = peso / (altura * altura);

     
            let classificacao = "";
            let cor = "";

            
            if (imc < 18.5) {
                classificacao = "Abaixo do peso";
                cor = "blue"; // 🔵
            } else if (imc >= 18.5 && imc < 25) {
                classificacao = "Peso normal";
                cor = "green"; // 🟢
            } else if (imc >= 25 && imc < 30) {
                classificacao = "Sobrepeso";
                cor = "goldenrod"; // 🟡
            } else {
                classificacao = "Obesidade";
                cor = "red"; // 🔴
            }

         
            let resultadoElemento = document.getElementById("resultado");
            
            
            resultadoElemento.textContent = `Seu IMC é ${imc.toFixed(2)} - ${classificacao}`;
            resultadoElemento.style.color = cor;
        }
    </script>

</body>
</html>
